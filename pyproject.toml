[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexustrade"
version = "5.1.0"
description = "Typed Python SDK for NexusTrade portfolio authoring, backtesting, and optimization"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Starks Technology" }]
keywords = ["nexustrade", "trading", "backtesting", "algorithmic-trading", "portfolio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# The client and the authoring builders are stdlib-only on purpose: the base
# install stays importable anywhere.
dependencies = []

[project.optional-dependencies]
# Exact pins, deliberately. An unbounded range lets a future release — or a
# compromised one — install itself into anyone who runs `pip install
# 'nexustrade[stats]'`. These four versions all support the full
# requires-python range (3.10-3.13).
#
# Pins choose the version; the requirements-*.lock files verify the BYTES with
# sha256 hashes and pin the transitive deps too. Use the locks for CI and
# development installs.
#
# Cost of this choice: a dependent that needs a different numpy/pandas gets a
# resolver conflict on the extra. The base install is unaffected — it has no
# dependencies at all.
documents = [
  "liteparse==2.11.0",
  "pandas==2.3.3",
  "pillow==12.3.0",
  "pypdfium2==5.12.1",
]
# Exact dependency union of the NexusTrade compute runtime, published so that
# environment is reproducible by ordinary SDK users too.
compute = [
  "beautifulsoup4==4.15.0",
  "duckdb==1.3.2",
  "liteparse==2.11.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pillow==12.3.0",
  "pyarrow==20.0.0",
  "pypdfium2==5.12.1",
  "scipy==1.15.3",
  "statsmodels==0.14.6",
]
stats = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "statsmodels==0.14.6",
]

[project.urls]
Homepage = "https://nexustrade.io"
Repository = "https://github.com/austin-starks/nexustrade-py"

[tool.hatch.build.targets.wheel]
packages = ["nexustrade"]

[tool.hatch.build.targets.sdist]
include = [
  "nexustrade",
  "tests",
  "README.md",
  "AGENTS.md",
  "CLAUDE.md",
  "LICENSE",
  "requirements-compute.lock",
  "requirements-documents.lock",
  "requirements-stats.lock",
]
# Keep local virtualenvs and build output out of the sdist; a PyPI version can
# never be re-uploaded to correct it.
exclude = [
  ".venv*",
  "**/__pycache__",
  "dist",
]
