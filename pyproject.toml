[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexustrade"
version = "1.9.0"
description = "Typed Python SDK for NexusTrade portfolio authoring, backtesting, and optimization"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Starks Technology" }]
keywords = ["nexustrade", "trading", "backtesting", "algorithmic-trading", "portfolio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# The client and the authoring builders are stdlib-only on purpose: the base
# install stays importable anywhere.
dependencies = []

[project.optional-dependencies]
# Exact pins, deliberately. An unbounded range lets a future release — or a
# compromised one — install itself into anyone who runs `pip install
# 'nexustrade[stats]'`. These four versions all support the full
# requires-python range (3.10-3.13).
#
# Pins choose the version; requirements-stats.lock verifies the BYTES with
# sha256 hashes and pins the transitive deps too. Use the lock for CI and
# development installs — `make lock-sdk-stats` regenerates it from these pins.
#
# Cost of this choice: a dependent that needs a different numpy/pandas gets a
# resolver conflict on the extra. The base install is unaffected — it has no
# dependencies at all.
# Local analysis of a lake result: duckdb_relation(), iter_batches(),
# to_pandas(). nexustrade.lake itself imports only stdlib + client, so the
# module resolves on a base install; only these calls need the extra.
lake = [
  "duckdb==1.3.2",
  "pandas==2.3.3",
  "pyarrow==20.0.0",
]
documents = [
  "liteparse==2.11.0",
  "pandas==2.3.3",
  "pillow==12.3.0",
  "pypdfium2==5.12.1",
]
# Exact union baked into the NexusTrade compute image. Keeping it public makes
# the deployed dependency surface reproducible by ordinary SDK users too.
compute = [
  "beautifulsoup4==4.15.0",
  "duckdb==1.3.2",
  "liteparse==2.11.0",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pillow==12.3.0",
  "pyarrow==20.0.0",
  "pypdfium2==5.12.1",
  "scipy==1.15.3",
  "statsmodels==0.14.6",
]
stats = [
  "numpy==2.2.6",
  "pandas==2.3.3",
  "scipy==1.15.3",
  "statsmodels==0.14.6",
]

[project.urls]
Homepage = "https://nexustrade.io"
Repository = "https://github.com/austin-starks/nexustrade-py"

[tool.hatch.build.targets.wheel]
packages = ["nexustrade"]

[tool.hatch.build.targets.sdist]
include = [
  "nexustrade",
  "tests",
  "README.md",
  "AGENTS.md",
  "CLAUDE.md",
  "LICENSE",
  "requirements-lake.lock",
  "requirements-compute.lock",
  "requirements-documents.lock",
  "requirements-stats.lock",
]
# `include` alone did not keep a local virtualenv out of the sdist — a build run
# after `make test-sdk-python-stats` shipped 12MB of vendored numpy/scipy test
# data. The venv now lives outside this directory AND is excluded here, because
# a PyPI version can never be re-uploaded to correct it.
exclude = [
  ".venv*",
  "**/__pycache__",
  "dist",
]
